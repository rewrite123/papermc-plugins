name: Build tpcost

on:
  push:
    paths:
      - 'tpcost/**'
      - '.github/workflows/tpcost-*.yml'
  pull_request:
    paths:
      - 'tpcost/**'
      - '.github/workflows/tpcost-*.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tpcost
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tpcost
          path: tpcost/build/libs/*.jar
          if-no-files-found: error
