name: Publish tpcost to Hangar

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: Release changelog
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tpcost-hangar-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tpcost
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew build --no-daemon
      - name: Publish
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT || 'tpcost' }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          if [ -z "$HANGAR_API_TOKEN" ]; then
            echo "::error::Set the HANGAR_API_TOKEN repository secret before publishing."
            exit 1
          fi
          ./gradlew publishPluginPublicationToHangar --no-daemon \
            "-PhangarProject=$HANGAR_PROJECT" "-PhangarChangelog=$CHANGELOG"
