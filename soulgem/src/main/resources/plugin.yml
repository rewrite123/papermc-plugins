name: soulgem
version: '${version}'
main: io.github.ihormel.soulgem.SoulGemPlugin
api-version: '26.3'
description: Charge crafted soul gems with XP and use them instead of lapis in the enchanting table.
permissions:
  soulgem.use:
    description: Charge soul gems and enchant gear with them.
    default: true
